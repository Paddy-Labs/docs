openapi: 3.1.3
info:
  title: PaddyLabs Subscription API
  version: '20250820'
  description: paddylabs.ie
servers:
  - url: http://localhost:3002
    description: Local
  - url: https://subscription.dycama.link
    description: Development
  - url: https://subscription.dycama.com
    description: Production
tags:
  - name: auth
    description: Authentication
  - name: transaction
    description: Transaction
  - name: subscription
    description: Subscription
security:
  - ApiKeyAuth: []
paths:
  '/auth/login':
    post:
      tags:
        - auth
      operationId: 'authLogin'
      description: Login customer
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AuthLoginBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AuthLoginResponse'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/auth/forgot':
    post:
      tags:
        - auth
      operationId: 'authForgot'
      description: Forgot password
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AuthForgotBody'
      responses:
        '200':
          description: Success
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/auth/reset':
    post:
      tags:
        - auth
      operationId: 'authReset'
      description: Reset password
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AuthResetBody'
      responses:
        '200':
          description: Success
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/auth/lookup':
    get:
      tags:
        - auth
      operationId: 'authLookup'
      description: Lookup subscription
      parameters:
        - name: id
          in: query
          description: Subscription ID
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AuthLookupResponse'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/tracking':
    post:
      tags:
        - tracking
      operationId: 'trackEvent'
      description: >
        Forwards a landing-page funnel event to the matching tracking Firehose
        delivery stream. Only the envelope (api_name, session_id) is validated;
        all remaining fields pass through unchanged. Fire-and-forget: delivery
        failures are logged and still return 202.
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/TrackingEventBody'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/ip-validation':
    post:
      tags:
        - ip-validation
      operationId: 'validateIP'
      description: >
        Scores a visitor IP against the approve-mode rules and returns reforge's
        ValidationInfo. Vendor data is cached in DynamoDB for one hour, keyed on
        the IP alone, and the target country is compared at read time. Vendor
        failure, malformed vendor payloads and missing configuration all return
        200 with validation_success false and the cautious verdict, so a landing
        page can always render.
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/IPValidationBody'
      responses:
        '200':
          description: Scored verdict, or the fail-closed payload
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ValidationInfo'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/init':
    post:
      tags:
        - subscription
      operationId: 'initSubscription'
      description: Create subscription
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/SubscriptionInitBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SubscriptionInitResponse'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SubscriptionInitError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/init/3ds':
    post:
      tags:
        - subscription
      operationId: 'validate3DSSubscription'
      description: Validates 3DS subscription
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/SubscriptionValidate3DSBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SubscriptionValidate3DSResponse'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SubscriptionValidate3DSError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/cancel':
    post:
      parameters:
        - name: email
          in: query
          description: Customer email
          required: true
          schema:
            type: string
            example: dev@paddylabs.ie
        - name: gateway
          in: query
          description: Subscription Gateway
          schema:
            type: string
            enum:
              - ROCKETGATE
              - PAYSIGHT
            example: PAYSIGHT
        - name: domainSendCancelEmail
          in: query
          description: Domain to restrict send cancel email
          required: false
          schema:
            type: string
            example: ebkreads.com
      tags:
        - subscription
      operationId: 'cancelSubscription'
      description: Cancel subscription
      responses:
        '200':
          description: Success
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/refund':
    post:
      tags:
        - subscription
      operationId: 'refundTransaction'
      description: >
        Refund a transaction through its payment gateway (PaySight or
        RocketGate). Internal endpoint for the customer service chatbot. The
        transaction must belong to the given customer email, otherwise it is
        reported as not found. Omit amount for a full refund. On success the
        original transaction is marked REFUNDED, so it cannot be refunded
        again. Identify the transaction by its gateway id,
        externalTransactionId, from GET /refund/transactions. Besides the
        shared x-api-key, requires the x-refund-api-key header to match
        REFUND_API_KEY; refused for everyone while that is not configured.
        Rate limited to 10 requests per minute and 100 per 24 hours per API
        key.
      security:
        - ApiKeyAuth: []
          RefundApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/RefundBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/RefundResponse'
        '400':
          description: >
            Client error: invalid body (including an amount with more than two
            decimals), transaction not refundable (already refunded, or still
            pending), amount above the
            transaction amount, or refunds are not available
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: >
            Missing or wrong x-api-key or x-refund-api-key, or REFUND_API_KEY
            is not configured
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '404':
          description: >
            Transaction not found for this customer (message is always
            "Transaction not found.")
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '409':
          description: >
            More than one refundable transaction of this customer has that
            externalTransactionId (TransactionAmbiguousExternalIdError); none
            was refunded
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '429':
          description: >
            Rate limit exceeded: at most 10 refunds per minute, or 100 per 24
            hours, per API key
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '502':
          description: >
            The payment gateway failed or rejected the refund (error
            RefundGatewayError). The message is generic; the gateway's reason
            is logged, not returned. The transaction is left unchanged.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/refund/transactions':
    get:
      tags:
        - subscription
      operationId: 'listRefundableTransactions'
      security:
        - ApiKeyAuth: []
          RefundApiKeyAuth: []
      description: >
        List the transactions of a customer that can still be refunded, newest
        first, so the customer service chatbot can pick the
        externalTransactionId to send to POST /refund. Only approved sales
        and auth-only charges with an amount above zero are listed; pending
        charges (which may still fail) and refunded ones are left out.
        Needs the same x-refund-api-key as POST /refund. Rate limited to 30
        requests per minute per API key, separately from refunds.
      parameters:
        - name: email
          in: query
          required: true
          description: Customer email (case-insensitive)
          schema:
            type: string
            format: email
            example: dev@paddylabs.ie
      responses:
        '200':
          description: Success (an empty list when nothing is refundable)
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/RefundableTransactionsResponse'
        '400':
          description: Invalid email, or refunds are not available
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: >
            Missing or wrong x-api-key or x-refund-api-key, or REFUND_API_KEY
            is not configured
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded, at most 30 lookups per minute
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/transactions':
    get:
      parameters:
        - name: gateway
          in: query
          required: true
          description: >-
            Payment gateway the transaction's customer belongs to.
            Case-insensitive.
          schema:
            type: string
            enum:
              - ROCKETGATE
              - PAYSIGHT
            example: PAYSIGHT
        - name: status
          in: query
          required: false
          style: form
          explode: true
          description: >-
            Transaction status to include. Repeat the parameter to match any of
            several statuses, e.g. `status=APPROVED&status=PENDING`.


            Defaults to `APPROVED` when the parameter is omitted, so an
            unfiltered call returns approved transactions only.
            Case-insensitive.
          schema:
            type: array
            items:
              type: string
              enum:
                - PENDING
                - APPROVED
                - DECLINED
                - VOIDED
                - REFUNDED
                - CHARGEBACK
                - CHARGEBACK_ALERT
                - UNKNOWN
                - SUCCEEDED
            default:
              - APPROVED
          example:
            - APPROVED
            - PENDING
        - name: declineSalvage
          in: query
          required: false
          style: form
          explode: true
          description: >-
            Decline-salvage state to include. Repeat the parameter to match any
            of several values, e.g.
            `declineSalvage=false&declineSalvage=null`.


            This is a three-state value. `true` and `false` are recorded only by
            PAYSIGHT flows; `null` means no value was ever recorded, which is
            the case for every ROCKETGATE transaction. `null` is therefore a
            distinct state and is never treated as equivalent to `false`.


            Defaults to `false` when the parameter is omitted. Because ROCKETGATE
            transactions are always `null`, that default excludes them — pass
            `any` or `null` explicitly to see them.


            Pass `any` to disable the filter and return all three states. `any`
            takes precedence when combined with other values.
            Case-insensitive.
          schema:
            type: array
            items:
              type: string
              enum:
                - 'true'
                - 'false'
                - 'null'
                - 'any'
            default:
              - 'false'
          example:
            - 'false'
            - 'null'
        - name: startDate
          in: query
          required: false
          description: >-
            Inclusive lower bound on the transaction's creation timestamp
            (ISO 8601). Unbounded when omitted.
          schema:
            type: string
            format: date-time
            example: 2025-07-24T00:00:00Z
        - name: endDate
          in: query
          required: false
          description: >-
            Inclusive upper bound on the transaction's creation timestamp
            (ISO 8601). Unbounded when omitted.
          schema:
            type: string
            format: date-time
            example: 2025-07-28T23:59:59Z
        - name: limit
          in: query
          required: false
          description: Maximum number of transactions per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor identifying the page boundary, taken from
            `metadata.startCursor` or `metadata.endCursor` of a previous
            response.
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          required: false
          description: >-
            Whether to page forwards or backwards from `cursor`. Ignored unless
            `cursor` is also supplied. Case-insensitive.
          schema:
            type: string
            enum:
              - previous
              - next
            default: next
            example: next
      tags:
        - transaction
      operationId: 'getTransactions'
      summary: List initial standard transactions
      description: >-
        Returns initial checkout transactions, newest first by creation time.


        Beyond the query filters below, the endpoint always constrains results
        to transactions that are of type `AUTH_ONLY` or `SALE`, have a billing
        type of `INITIAL`, and carry `udf01=standard`. Rebills, refunds and
        non-standard traffic are therefore never returned, regardless of the
        filters supplied.


        Filters combine with AND; repeating a single parameter matches any of
        its values (OR). `status` and `declineSalvage` both apply a default when
        omitted, so an unfiltered call is narrower than it may appear — see each
        parameter for its fallback.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/GetTransactionsResponse'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

  '/search':
    get:
      parameters:
        - name: email
          in: query
          description: Customer email
          required: true
          schema:
            type: string
            example: dev@paddylabs.ie
      tags:
        - subscription
      operationId: 'searchSubscription'
      description: Searches subscription
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SubscriptionSearchResponse'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    RefundApiKeyAuth:
      type: apiKey
      in: header
      name: x-refund-api-key
      description: >
        Refund secret (REFUND_API_KEY), separate from x-api-key. Required, on
        top of x-api-key, by POST /refund and GET /refund/transactions.

  schemas:
    TrackingEventBody:
      type: object
      description: >
        Flat funnel event; fields besides api_name and session_id depend on
        api_name and pass through to the data lake unvalidated.
      properties:
        api_name:
          type: string
          enum:
            - view
            - form
            - submit
            - transaction
        session_id:
          type: string
          format: uuid
        _metadata:
          type: object
          properties:
            stored_at:
              type: string
              format: date-time
            script_version:
              type: string
      required:
        - api_name
        - session_id
      additionalProperties: true

    IPValidationBody:
      type: object
      properties:
        ip:
          type: string
          description: Visitor IPv4 or IPv6 address
          example: '24.48.0.1'
        targetCountry:
          type: string
          description: >
            ISO-3166 alpha-2 code for the landing page's target country,
            uppercased server side. Per landing page, never defaulted.
          example: 'US'
      required:
        - ip
        - targetCountry

    ValidationInfo:
      type: object
      description: >
        Shape owned by reforge-nextjs/src/lib/session.ts. Spread straight into
        the reforge session with no mapping.
      properties:
        validation_success:
          type: boolean
          description: False when the verdict came from the fail-closed fallback
        validation_valid:
          type: boolean
          description: True renders the classic variant, false renders approval
        validation_target_country:
          type: string
        validation_vpn:
          type: boolean
        validation_proxy:
          type: boolean
        validation_tor:
          type: boolean
        validation_relay:
          type: boolean
        validation_monitor:
          type: boolean
        validation_country_code:
          type: string
          description: Detected country, or 'Unknown' on the fallback path
        validation_connection_type:
          type: string
        validation_issues:
          type: array
          items:
            type: string
        validation_reason:
          type: string
          description: Issues joined with ', ', empty string when valid
        validation_timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds
        connection_isp:
          type: string
      required:
        - validation_success
        - validation_valid
        - validation_target_country
        - validation_vpn
        - validation_proxy
        - validation_tor
        - validation_relay
        - validation_monitor
        - validation_country_code
        - validation_connection_type
        - validation_issues
        - validation_reason
        - validation_timestamp
        - connection_isp

    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date
        status:
          type: number
        error:
          type: string
        messages:
          type: array
          items:
            type: string
        path:
          type: string
      required:
        - timestamp
        - status
        - error
        - message
        - path

    SubscriptionInitError:
      type: object
      properties:
        timestamp:
          type: string
          format: date
        status:
          type: number
        error:
          type: string
        message:
          type: string
        paysightSession:
          type: string
        partnerSession:
          type: string
        subscribeSuccess:
          type: boolean
        chargeSuccess:
          type: boolean
        info:
          type: string
        email:
          type: string
        orderId:
          type: number
        transactionId:
          type: string
        descriptor:
          type: string
        mid:
          type: string
        amount:
          type: number
        statusId:
          type: number
        path:
          type: string
      required:
        - timestamp
        - status
        - error
        - message
        - paysightSession
        - partnerSession
        - subscribeSuccess
        - chargeSuccess
        - info
        - email
        - orderId
        - transactionId
        - mid
        - amount
        - path

    SubscriptionValidate3DSError:
      type: object
      properties:
        status:
          type: number
        error:
          type: string
        message:
          type: string
        paysightSession:
          type: string
        partnerSession:
          type: string
        subscribeSuccess:
          type: boolean
        chargeSuccess:
          type: boolean
        info:
          type: string
        email:
          type: string
        orderId:
          type: number
        transactionId:
          type: string
        descriptor:
          type: string
        mid:
          type: string
        amount:
          type: number
        statusId:
          type: number
      required:
        - error
        - message
        - paysightSession
        - partnerSession
        - subscribeSuccess
        - chargeSuccess
        - info
        - email
        - orderId
        - transactionId
        - mid
        - amount

    AuthLoginBody:
      type: object
      properties:
        domain:
          type: string
          example: paddylabs.ie
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - domain
        - email
        - type

    AuthLoginResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          example: PAID
        level:
          type: string
          example: PREMIUM
        portal:
          type: string
          example: paddylabs.ie
      required:
        - id
        - status
        - level
        - portal

    AuthForgotBody:
      type: object
      properties:
        domain:
          type: string
          example: paddylabs.ie
        email:
          type: string
          format: email
      required:
        - domain
        - email

    AuthResetBody:
      type: object
      properties:
        code:
          type: string
        newPassword:
          type: string
          format: password
      required:
        - code
        - newPassword

    AuthLookupResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          examples:
            - PAID
            - UNPAID
        level:
          type: string
          example: PREMIUM
        portal:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        subscriptionDate:
          type: number
          format: unix timestamp
        subscriptionRebillDate:
          type: number
          format: unix timestamp
        declineSalvage:
          type: boolean
          description: >
            Decline-salvage flag of the subscription's most recent transaction
            that carries one. False when no transaction has a value.
      required:
        - id
        - status
        - level
        - portal
        - firstName
        - lastName
        - email
        - subscriptionDate
        - subscriptionRebillDate
        - declineSalvage

