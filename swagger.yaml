    RefundBody:
      type: object
      properties:
        externalTransactionId:
          type: string
          minLength: 1
          description: >
            The payment gateway's transaction id (PaySight messageId or
            RocketGate transaction id), as returned by GET /refund/transactions
        email:
          type: string
          format: email
          description: Email of the customer who owns the transaction
          example: dev@paddylabs.ie
        amount:
          type: number
          exclusiveMinimum: 0
          description: >
            Amount to refund in the transaction currency, as a decimal. Must
            not exceed the transaction amount. Omit for a full refund. At most
            two decimals.
          multipleOf: 0.01
          example: 12.99
      required:
        - externalTransactionId
        - email

    RefundResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
          description: Our internal id of the refunded transaction
        externalTransactionId:
          type: string
          description: The payment gateway's transaction id
        status:
          type: string
          enum:
            - REFUNDED
        refundedAmount:
          type: number
          description: Decimal amount sent to the gateway for refund
          example: 12.99
      required:
        - transactionId
        - externalTransactionId
        - status
        - refundedAmount

