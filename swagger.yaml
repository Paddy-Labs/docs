      type: object
      properties:
        transactions:
          type: array
          items:
            type: object
            properties:
              transactionId:
                type: string
                format: uuid
                description: Our internal id, for reference
              externalTransactionId:
                type: string
                description: >
                  The payment gateway's transaction id; pass as
                  externalTransactionId to POST /refund
              date:
                type: string
                format: date-time
                description: When the customer was charged
              amount:
                type: number
                description: Decimal amount in the transaction currency
                example: 19.99
              currency:
                type: string
                example: EUR
              status:
                type: string
                enum:
                  - APPROVED
              domain:
                type: string
                description: Site the customer bought on
                example: example.com
